services:
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: privado
      VPN_TYPE: openvpn
      OPENVPN_USER: ${PRIVADO_USER}
      OPENVPN_PASSWORD: ${PRIVADO_PASS}
      SERVER_COUNTRIES: USA
      FIREWALL_OUTBOUND_SUBNETS: ${LAN_SUBNET},172.20.0.0/16
      FIREWALL_INPUT_PORTS: "5030,5031,50300,5600,5601,21248,21249,8080,42243"
      TZ: America/Vancouver
    ports:
      - "5030:5030"
      - "5031:5031"
      - "50300:50300"
      - "5600:5600"
      - "5601:5601"
      - "21248:21248"
      - "21248:21248/udp"
      - "21249:21249"
    restart: unless-stopped
    cpus: "2"
    mem_limit: 256m
    memswap_limit: 256m
    networks:
      - media_net

  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    # NOT behind gluetun: Usenet is an authenticated SSL connection to a provider
    # you pay, with no peers and no swarm to be observed in - the infringement
    # notices came from BitTorrent. Keeping it direct also avoids sharing
    # gluetun's 1-CPU cap with 40 download connections.
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Vancouver
    volumes:
      - /opt/media/config/nzbget:/config
      - /opt/media/downloads/nzb-incomplete:/incomplete
      - /mnt/drive1/Mount/Videos/_downloads:/downloads
      - /mnt/drive1/Mount:/data
    ports:
      - "6789:6789"
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 1g
    memswap_limit: 1g
    networks:
      - media_net

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    # 2026-08-24: OUT of the gluetun VPN by user decision (accepts home-IP exposure
    # / prior ISP infringement notices) to escape passive-mode connectivity. Publishes
    # its own ports; UPnP on the router governs active vs passive. NOTE: clear qbit
    # current_network_interface (was tun0) after moving or it has no connectivity.
    ports:
      - "8080:8080"
      - "42243:42243/tcp"
      - "42243:42243/udp"
    networks:
      - media_net
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Vancouver
      WEBUI_PORT: "8080"
    volumes:
      - /opt/media/config/qbittorrent:/config
      - /opt/media/downloads/incomplete:/incomplete
      - /mnt/drive1/Mount/Videos/_downloads:/downloads
      - /mnt/drive1/Mount:/data
    restart: unless-stopped
    cpus: "4"
    mem_limit: 1g
    memswap_limit: 1g

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Vancouver
    ports:
      - "9696:9696"
    volumes:
      - /opt/media/config/prowlarr:/config
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 2g
    memswap_limit: 2g
    networks:
      - media_net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Vancouver
    ports:
      - "8989:8989"
    volumes:
      - /opt/media/config/sonarr:/config
      - /mnt/drive1/Mount/Videos/TV:/tv
      - /mnt/drive1/Mount/Videos/_downloads:/downloads
      - /mnt/drive1/Mount:/data
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      - prowlarr
      - qbittorrent
    networks:
      - media_net

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Vancouver
    ports:
      - "7878:7878"
    volumes:
      - /opt/media/config/radarr:/config
      - /mnt/drive1/Mount/Videos/Movies:/movies
      - /mnt/drive1/Mount/Videos/_downloads:/downloads
      - /mnt/drive1/Mount:/data
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      - prowlarr
      - qbittorrent
    networks:
      - media_net

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Vancouver
    ports:
      - "8686:8686"
    volumes:
      - /opt/media/config/lidarr:/config
      - /mnt/drive1/Mount/Music:/music
      - /mnt/drive1/Mount/Videos/_downloads:/downloads
      - /mnt/drive1/Mount:/data
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 768m
    memswap_limit: 768m
    depends_on:
      - prowlarr
      - qbittorrent
    networks:
      - media_net

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Vancouver
    ports:
      - "6767:6767"
    volumes:
      - /opt/media/config/bazarr:/config
      - /mnt/drive1/Mount/Videos/Movies:/movies
      - /mnt/drive1/Mount/Videos/TV:/tv
      - /mnt/drive1/Mount:/data
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      - sonarr
      - radarr
    networks:
      - media_net

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    shm_size: "1gb"
    environment:
      TZ: America/Vancouver
      LOG_LEVEL: info
    ports:
      - "8192:8191"
    init: true
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    memswap_limit: 1g
    networks:
      - media_net

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "8096:8096"
    volumes:
      - /opt/media/config/jellyfin:/config
      - /mnt/drive1/Mount/Videos/Movies:/movies:ro
      - /mnt/drive1/Mount/Videos/TV:/tv:ro
      - /mnt/drive1/Mount/Music:/music:ro
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 1536m
    memswap_limit: 1536m
    networks:
      - media_net

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      TZ: America/Vancouver
    ports:
      - "5055:5055"
    volumes:
      - /opt/media/config/jellyseerr:/app/config
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      - jellyfin
    networks:
      - media_net

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Vancouver
      VERSION: docker
      ADVERTISE_IP: http://192.168.1.207:32400/
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /opt/media/config/plex:/config
      - /opt/media/transcode:/transcode
      - /mnt/drive1/Mount/Videos/Movies:/data/movies
      - /mnt/drive1/Mount/Videos/TV:/data/tv
      - /mnt/drive1/Mount/Music:/data/music
      - /mnt/drive1/Mount/Videos/_completed/movies:/data/staging/movies
      - /mnt/drive1/Mount/Videos/_completed/tv:/data/staging/tv
    restart: unless-stopped
    cpus: "3.0"
    cpu_shares: 2048
    mem_limit: 2g
    memswap_limit: 2g

  tdarr:
    profiles: ["manual"]   # disabled: start only with --profile manual
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Vancouver
      serverIP: 0.0.0.0
      serverPort: "8266"
      webUIPort: "8265"
      internalNode: "true"
      inContainer: "true"
      nodeName: NUC-internal
    volumes:
      - /opt/media/tdarr/server:/app/server
      - /opt/media/tdarr/configs:/app/configs
      - /opt/media/tdarr/logs:/app/logs
      - /mnt/drive1/Mount/Videos:/media
      - /mnt/drive1/tdarr-cache:/temp
    ports:
      - "8265:8265"
      - "8266:8266"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"
      - "44"
    restart: "no"
    cpus: "1.0"
    cpu_shares: 512
    mem_limit: 3g
    memswap_limit: 3g
    networks:
      - media_net

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Vancouver
      SLSKD_SLSK_USERNAME: ${SLSKD_SOULSEEK_USER}
      SLSKD_SLSK_PASSWORD: ${SLSKD_SOULSEEK_PASS}
      SLSKD_SLSK_LISTEN_PORT: "50300"
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      SLSKD_HTTP_PORT: "5030"
      SLSKD_HTTPS_PORT: "5031"
      SLSKD_USERNAME: ${SLSKD_WEBUI_USER}
      SLSKD_PASSWORD: ${SLSKD_WEBUI_PASS}
      SLSKD_DOWNLOADS_DIR: /downloads
      SLSKD_INCOMPLETE_DIR: /incomplete
      SLSKD_SHARED_DIR: /shared
    volumes:
      - /opt/media/config/slskd:/app
      - /mnt/drive1/Mount/_soulseek_downloads:/downloads
      - /opt/media/downloads/incomplete_slskd:/incomplete
      - /mnt/drive1/Mount/Music:/shared:ro
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    memswap_limit: 1g

  airdcpp:
    image: gangefors/airdcpp-webclient:latest
    container_name: airdcpp
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Vancouver
    volumes:
      - /opt/media/config/airdcpp:/.airdcpp
      - /mnt/drive1/Mount/_dcpp_downloads:/Downloads
      - /mnt/drive1/Mount:/Share:ro
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 512m
    memswap_limit: 512m

  soularr:
    profiles: ["disabled"]
    image: mrusse08/soularr:latest
    container_name: soularr
    environment:
      TZ: America/Vancouver
      SCRIPT_INTERVAL: "300"
    volumes:
      - /opt/media/config/soularr:/data
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      - lidarr
      - gluetun
    networks:
      - media_net

  slskd-bridge:
    profiles: ["disabled"]
    build: /opt/media/build/slskd-bridge
    container_name: slskd-bridge
    environment:
      RADARR_URL: http://radarr:7878
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_URL: http://sonarr:8989
      SONARR_API_KEY: ${SONARR_API_KEY}
      SLSKD_URL: http://gluetun:5030
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      DOWNLOAD_DIR: /downloads
      STAGING_DIR: /staging
      RADARR_STAGING_PREFIX: /data/_soulseek_video_staging
      SONARR_STAGING_PREFIX: /data/_soulseek_video_staging
      STATE_FILE: /data/state.json
      SCAN_INTERVAL: "900"
      POLL_INTERVAL: "60"
    volumes:
      - /opt/media/config/slskd-bridge:/data
      - /mnt/drive1/Mount/_soulseek_downloads:/downloads
      - /mnt/drive1/Mount/_soulseek_video_staging:/staging
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      - radarr
      - sonarr
      - gluetun
    networks:
      - media_net

  dashboard-stats:
    build: /opt/media/build/dashboard-stats
    container_name: dashboard-stats
    environment:
      SLSKD_URL: http://gluetun:5030
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      AIRDCPP_URL: http://gluetun:5600
      AIRDCPP_USER: ${AIRDCPP_USER}
      AIRDCPP_PASS: ${AIRDCPP_PASS}
      QBIT_URL: http://qbittorrent:8080
      QBIT_USER: ${QBIT_USER}
      QBIT_PASS: ${QBIT_PASS}
      SONARR_URL: http://sonarr:8989
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_URL: http://radarr:7878
      RADARR_API_KEY: ${RADARR_API_KEY}
      HOST_SYS: /host/sys
      HOST_PROC: /host/proc
      HOST_NIC: eno1
      HOST_WIFI_NIC: wlp58s0
      DOCKER_API: http://docker-proxy:2375
      ZOMBIE_ALERT: "50"
      SHIM_URL: http://slskd-shim:8200
      AUTH_LOG: /host/varlog/auth.log
      QBIT_LOG: /host/qbitlog/qbittorrent.log
      TZ: America/Vancouver
      RDAP_CACHE: /data/rdap_cache.json
      REPORT_SERVER_NAME: NUC media server
    volumes:
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
      - /var/log:/host/varlog:ro
      - /opt/media/config/qbittorrent/qBittorrent/logs:/host/qbitlog:ro
      - /opt/media/config/slskd-bridge/reaper.log:/host/reaperlog/reaper.log:ro
      - /opt/media/reaper-archive:/host/reaperarchive:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8100:8100"
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 128m
    memswap_limit: 128m
    depends_on:
      - gluetun
      - docker-proxy
    networks:
      - media_net

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: 192.168.1.207:3000,192.168.1.207,localhost:3000,localhost,stuff.jayshideout.site:3000,stuff.jayshideout.site,nuc:3000,nuc,homepage-auth:3000,homepage-auth
    # no published port: reachable only via homepage-auth, which adds the password
    volumes:
      - /opt/media/config/homepage:/app/config
      - /:/host_root:ro
      - /mnt/drive1:/host_drive1:ro
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      - dashboard-stats
      - gluetun
    networks:
      - media_net

  homepage-auth:
    image: nginx:alpine
    container_name: homepage-auth
    # Homepage has no built-in auth, so nginx fronts it with a password prompt.
    ports:
      - "3000:3000"
    volumes:
      - /opt/media/config/homepage-auth/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/media/config/homepage-auth/htpasswd:/etc/nginx/htpasswd:ro
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 128m
    memswap_limit: 128m
    depends_on:
      - homepage
    networks:
      - media_net

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    environment:
      CONTAINERS: "1"
      POST: "1"
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      EXEC: "0"
      SERVICES: "0"
      TASKS: "0"
      SECRETS: "0"
      CONFIGS: "0"
      SWARM: "0"
      NODES: "0"
      PLUGINS: "0"
      SYSTEM: "0"
      INFO: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      DISTRIBUTION: "0"
      SESSION: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 64m
    memswap_limit: 64m
    networks:
      - media_net

  slskd-shim:
    build: /opt/media/build/slskd-shim
    container_name: slskd-shim
    environment:
      SLSKD_URL: http://gluetun:5030
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      ARR_SAVE_PATH: /data/_soulseek_downloads
      LOCAL_SAVE_PATH: /downloads
      STATE_FILE: /data/shim_state.json
      SEARCH_TIMEOUT_MS: "12000"
    volumes:
      - /opt/media/config/slskd-shim:/data
      - /mnt/drive1/Mount/_soulseek_downloads:/downloads:ro
    ports:
      - "8200:8200"
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      - gluetun
    networks:
      - media_net

  torrent-reaper:
    build: /opt/media/build/dashboard-stats
    container_name: torrent-reaper
    command: ["python","-u","reaper.py"]
    environment:
      QBIT_URL: http://qbittorrent:8080
      QBIT_USER: ${QBIT_USER}
      QBIT_PASS: ${QBIT_PASS}
      SONARR_URL: http://sonarr:8989
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_URL: http://radarr:7878
      RADARR_API_KEY: ${RADARR_API_KEY}
      REAP_META_MIN: "3"
      REAP_NOSEED_MIN: "2"
      REAP_PARTIAL_MIN: "2"
      REAP_PROMOTE_MAX: "10"
      REAP_INTERVAL: "60"
      REAP_DRY_RUN: "false"
      REAP_LOG: /data/reaper.log
    volumes:
      - /opt/media/config/slskd-bridge:/data
      - /opt/media/reaper-archive:/data/reaper-archive
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 192m
    memswap_limit: 192m
    depends_on:
      - qbittorrent
    networks:
      - media_net

  binsearch-shim:
    build: /opt/media/build/binsearch-shim
    container_name: binsearch-shim
    environment:
      BINSEARCH_URL: https://binsearch.info
      SELF_URL: http://binsearch-shim:8300
      MIN_SIZE_MB: "20"
      CACHE_TTL: "300"
      TZ: America/Vancouver
    ports:
      - "8300:8300"
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 192m
    memswap_limit: 192m
    networks:
      - media_net

  nzbking-shim:
    build: /opt/media/build/nzbking-shim
    container_name: nzbking-shim
    environment:
      NZBKING_URL: https://nzbking.com
      SELF_URL: http://nzbking-shim:8301
      MIN_SIZE_MB: "20"
      MIN_COMPLETE: "0.95"
      CACHE_TTL: "300"
      TZ: America/Vancouver
    ports:
      - "8301:8301"
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 192m
    memswap_limit: 192m
    networks:
      - media_net

networks:
  media_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
